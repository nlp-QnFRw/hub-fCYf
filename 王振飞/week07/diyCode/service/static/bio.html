<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIO 标签可视化</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#20304a;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}main{height:100dvh;display:flex;flex-direction:column;gap:10px;padding:12px 18px;max-width:1800px;margin:auto;overflow:hidden}a{color:#285fc0;text-decoration:none}.header{display:flex;align-items:baseline;gap:18px;flex:none}.header h1{font-size:21px;margin:0}.header .lead{font-size:13px;color:#72819a;margin:0}.box{background:white;border:1px solid #e4eaf3;border-radius:12px;padding:13px 15px;min-height:0}.top{display:grid;grid-template-columns:minmax(300px,0.85fr) minmax(480px,1.7fr);gap:10px;flex:none}.tabs,.controls,.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.tab,button{border:1px solid #d5deeb;background:#fff;padding:6px 10px;border-radius:7px;color:#344a68;font:inherit;font-size:12px;cursor:pointer}.tab.active,button.primary,.step.active{background:#285fd4;color:#fff;border-color:#285fd4}button:disabled{opacity:.5;cursor:default}.note{color:#667790;font-size:12px;line-height:1.45;margin:6px 0}.modebox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px}.modebox .note{flex:1;min-width:220px}textarea{font:inherit;font-size:13px;width:100%;height:53px;min-height:40px;border:1px solid #d4dfed;border-radius:7px;padding:7px;resize:vertical}.controls{margin-top:6px}.flow{gap:4px}.step{background:#eef3fc;font-size:12px}.arrow{color:#9baac0}.stage-title{font-size:14px;font-weight:700;margin:7px 0 0;display:inline}.stage-description{display:flex;gap:8px;align-items:baseline}.stage-description .note{margin:2px 0}.callout{background:#f2f6fd;border-left:3px solid #7099e8;padding:5px 9px;font-size:12px;line-height:1.4;color:#536780}.workspace{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(350px,0.9fr);gap:10px;flex:1;min-height:0}.visual,.details{display:flex;flex-direction:column;min-height:0}.sectionhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;flex:none}.sectionhead h2{font-size:15px;margin:0}.legend{display:flex;gap:9px;flex-wrap:wrap;font-size:11px;color:#66768e}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.board{display:flex;align-content:flex-start;align-items:flex-start;flex-wrap:wrap;gap:5px;padding:9px 2px;overflow:auto;flex:1;min-height:0}.tile{width:68px;min-width:68px;border:1px solid #dbe5f3;border-radius:7px;text-align:center;overflow:hidden;background:#fff}.tile .idx{font-size:9px;color:#94a3b8;background:#f7f9fc;padding:1px}.tile .char{font-size:20px;font-weight:700;height:32px;padding:1px}.tag{min-height:37px;padding:3px;font-size:10px;font-weight:650;overflow-wrap:anywhere;line-height:1.2;background:#f0f4fa;color:#73839b}.tile.trg{border-color:#e99e78}.tile.trg .tag{background:#fff0e7;color:#b64d20}.tile.arg{border-color:#88c3a4}.tile.arg .tag{background:#e7f8ef;color:#187748}.tile.unseen{opacity:.55;border-style:dashed}.warning{color:#b55126}.details{gap:6px}.details h2{font-size:15px;margin:0}.tablewrap{overflow:auto;min-height:0;flex:1}table{border-collapse:collapse;width:100%;font-size:11px}th,td{text-align:left;padding:6px;border-bottom:1px solid #e9eef6;white-space:nowrap}th{background:#f7f9fc;position:sticky;top:0}.goldpanel{border-top:1px solid #e7edf6;padding-top:6px;flex:none}.goldpanel summary{cursor:pointer;color:#426393;font-size:12px;font-weight:600}.goldpanel pre{white-space:pre-wrap;word-break:break-word;background:#f7f9fc;padding:8px;border-radius:7px;font-size:11px;max-height:115px;overflow:auto;margin:6px 0}.hidden{display:none!important}#status{margin:3px 0 0}#truncated{flex:none;margin:3px 0}.details>.note{margin:2px 0}@media(max-width:850px){main{height:auto;min-height:100dvh;overflow:visible}.header .lead{display:none}.top,.workspace{grid-template-columns:1fr}.board{max-height:40vh;min-height:200px}.tablewrap{max-height:30vh}.details{min-height:280px}}@media(max-height:680px) and (min-width:851px){main{padding:7px 12px;gap:6px}.box{padding:8px 10px}.note{margin:3px 0}.tile .char{height:27px;font-size:18px}.tag{min-height:30px}.callout{display:none}}
.compare-row{border-top:1px solid #dbe5f3;padding:3px;font-size:10px;overflow-wrap:anywhere;line-height:1.2;min-height:33px}.compare-row.ok{background:#edf9f2;color:#137849}.compare-row.bad{background:#fff1ef;color:#b52f2b}.compare-row.neutral{background:#f4f6f9;color:#7a899d}.compare-row b{display:block;font-size:9px}.mismatch td{background:#fff4f1}.alignment td{background:#f4f8ff}
 .detailtabs{display:flex;gap:5px;align-items:center}.detailtabs button{padding:5px 9px}.detailtabs button.active{background:#285fd4;color:white;border-color:#285fd4}.jsonwrap{flex:1;min-height:0;overflow:auto;background:#f7f9fc;border-radius:8px;padding:10px}.jsonwrap pre{margin:0;font:12px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-word}.jsonhint{color:#7a5b2c;background:#fff8e8;padding:7px;border-radius:6px;font-size:12px;line-height:1.4}
</style></head><body><main><header class="header"><a href="/">← 返回</a><h1>看见 BERT 的 BIO 标签</h1><p class="lead">从原文到标签：一字一格观察训练与推理</p></header>
<div class="top"><section class="box"><div class="tabs"><button class="tab active" id="trainingTab">训练：真实标注</button><button class="tab" id="predictTab">推理：输入句子</button></div><div id="trainingInput" class="modebox"><button id="next">换一条训练样本</button><span id="sample" class="note"></span><p class="note">展示真实训练目标，不是训练过程录像。</p></div><div id="predictInput" class="hidden"><textarea id="text">某公司拟回购股份，回购金额为一亿元。</textarea><div class="controls"><button class="primary" id="predict">分析这句话</button><span class="note">首次加载模型可能需要一些时间</span></div></div><p id="status" class="note" aria-live="polite"></p></section>
<section class="box"><div class="flow" id="flow"></div><div class="controls"><button id="prevStep">← 上一步</button><button class="primary" id="nextStep">下一步 →</button><button id="play">▶ 自动播放</button></div><div class="stage-description"><div class="stage-title" id="stageTitle"></div><p class="note" id="stageText"></p></div><div class="callout" id="explain"></div></section></div>
<div class="workspace"><section class="box visual"><div class="sectionhead"><h2>字符与 BIO 标签</h2><div class="legend"><span><i class="dot" style="background:#c95c29"></i>触发词 TRG</span><span><i class="dot" style="background:#198454"></i>论元 ARG</span><span><i class="dot" style="background:#9baac0"></i>O</span></div></div><p class="note" id="boardHint"></p><div class="board" id="board"></div><p class="note warning" id="truncated"></p></section>
<section class="box details"><div class="detailtabs"><button id="tokenView" class="active">Token 对齐</button><button id="jsonView" class="hidden">结构化 JSON</button><span id="resultAvailable" class="note"></span></div><p class="note" id="tokenHint"></p><div class="tablewrap" id="tokenPanel"><table><thead><tr><th>序号</th><th>Token</th><th>位置</th><th>目标标签</th><th>模型预测</th><th>对比</th></tr></thead><tbody id="tokens"></tbody></table></div><div id="jsonPanel" class="jsonwrap hidden"><div class="jsonhint">最终结果复用首页抽取流程：分段 → BIO 合并 → 事件构造 → schema 与原文校验。左侧只展示输入开头的一次原始 token 预测；长文本时两者范围及上下文不同，结果可能不完全对应。</div><pre id="jsonResult">暂无结果</pre></div><p class="note" id="detailFooter">一致性按 token 计算；推理模式的百分比为 token 最大 softmax 值，不是事件正确概率。</p><details class="goldpanel"><summary>查看样本原始标注</summary><pre id="gold"></pre></details></section></div>
</main><script>
const $=s=>document.querySelector(s);let mode='training', data=null, sampleIndex=0, stage=0, timer=null, detailView='token';
const paths={training:[['原文','训练样本含有原始句子及人工标注的事件类型、触发词和角色。'],['字符标注','先将每个字符设为 O，再按原文 span 标记论元，最后标记触发词。重叠时触发词覆盖论元。'],['Token 对齐','tokenizer 返回原文 offset；每个 token 取起始字符的标签，特殊 token 标签为 -100。'],['BERT + Linear','对比训练目标与当前模型预测。训练时用两者的分数计算交叉熵并更新参数；当前展示不会更新参数。']],prediction:[['输入原文','本演示将输入送入 tokenizer；超过最大 token 长度的部分不会被模型看到。'],['Token 编码','文本被拆成 token，并用 offset 记录各 token 在原文中的位置；一个 token 可以覆盖多个字符。'],['BERT + Linear','加载你训练好的 Linear 模型：每个 token 输出各标签分数，选择得分最高的标签。'],['映射与结果','左侧是原始 token 标签的字符投影；右侧展示经过片段合并和校验的最终事件 JSON。']]};
function esc(v){const d=document.createElement('div');d.textContent=String(v);return d.innerHTML}function changeMode(m){mode=m;stage=0;detailView='token';clearInterval(timer);timer=null;$('#play').textContent='▶ 自动播放';$('#trainingTab').classList.toggle('active',m==='training');$('#predictTab').classList.toggle('active',m==='prediction');$('#trainingInput').classList.toggle('hidden',m!=='training');$('#predictInput').classList.toggle('hidden',m!=='prediction');data=null;render();if(m==='training')load()}
async function load(){const body=mode==='training'?{mode,index:sampleIndex}:{mode,text:$('#text').value};$('#status').textContent='正在加载模型和数据…';$('#next').disabled=true;$('#predict').disabled=true;try{const r=await fetch('/api/bio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');data=j;stage=0;$('#status').textContent='已完成';if(mode==='training')$('#sample').textContent=`短训练样本 ${j.sample_index+1} / ${j.sample_count}`;render()}catch(e){$('#status').textContent=e.message}finally{$('#next').disabled=false;$('#predict').disabled=false}}
function render(){renderDetails();const steps=paths[mode];$('#flow').innerHTML=steps.map((v,i)=>`${i?'<span class="arrow">→</span>':''}<button class="step ${i===stage?'active':''}" data-step="${i}">${i+1}. ${esc(v[0])}</button>`).join('');document.querySelectorAll('[data-step]').forEach(x=>x.onclick=()=>{stage=+x.dataset.step;if(mode==='prediction')detailView=stage===3?'json':'token';render()});$('#stageTitle').textContent=steps[stage][0];$('#stageText').textContent=steps[stage][1];$('#explain').textContent=mode==='training'?(stage===3?'当前模型预测与训练目标比较；绿色一致，红色不同。它是训练完成后的实时推理，不是历史训练录像，也不会更新权重。':'B = 片段开始；I = 片段内部；O = 不属于任何片段。第三步将字符目标映射到 token。'):'预测时没有金标。这里展示 Linear 的原始 token 标签，尚未做事件类型筛选、规则合并或结果校验，可能出现非法 BIO。';$('#prevStep').disabled=stage===0;$('#nextStep').disabled=stage===3;const showTags=mode==='training'?stage>=1:stage>=2;$('#boardHint').textContent=mode==='training'?'训练字符金标；虚线格表示该字符没有被 token 覆盖或因截断未进入模型。':'模型输出按 token 原文范围投影；空格及未覆盖字符不会被假装预测为 O。';$('#tokenHint').textContent=mode==='training'?(stage===2?'第三步：每行展示 token 的原文位置与训练目标；特殊 token 的目标为 -100。':stage===3?'第四步：目标与当前模型预测逐 token 对比；特殊 token 不参与比较。':'这里的目标标签来自实际训练数据。'):'展示当前模型的原始 token 预测；[CLS]、[SEP] 为特殊 token。';if(!data){$('#board').innerHTML='<span class="note">请先选择样本或输入句子。</span>';$('#tokens').innerHTML='';$('#gold').textContent='暂无数据';$('#truncated').textContent='';return}$('#board').innerHTML=data.characters.map(c=>{let label=showTags?(c.label===null?(c.token_covered?'无标签':'无 token / 未覆盖'):c.label):'·';let cl=showTags&&label.includes('TRG:')?'trg':showTags&&label.includes('ARG:')?'arg':'';let display=c.char===' '?'␠':c.char==='\n'?'↵':c.char;const compare=mode==='training'&&stage===3;const pred=c.prediction===null?'未覆盖':c.prediction;const mark=c.match===null?'未参与':c.match?'一致':'不同';return `<div class="tile ${cl} ${c.token_covered?'':'unseen'}" title="原文字符位置 ${c.index}；一致性按所属 token 的目标和预测判断"><div class="idx">${c.index}${c.token_covered?'':' · 未覆盖'}</div><div class="char">${esc(display)}</div><div class="tag">${compare?'<b>字符金标</b><br>':''}${esc(label)}</div>${compare?`<div class="compare-row ${c.match===null?'neutral':c.match?'ok':'bad'}"><b>当前预测 · ${mark}</b>${esc(pred)}</div>`:''}</div>`}).join('');$('#tokens').innerHTML=data.tokens.map(t=>{const training=mode==='training',compare=training&&stage===3,align=training&&stage===2;const target=training&&stage>=2?(t.target??'忽略 (-100)'):'—';const pred=compare?(t.prediction??'—'):(!training&&showTags?(t.prediction??'—'):'—');const match=compare?(t.match===null?'忽略':t.match?'✓ 一致':'✕ 不同'):(!training&&showTags&&t.probability!==null?(100*t.probability).toFixed(1)+'%':'—');return `<tr class="${compare&&t.match===false?'mismatch':align?'alignment':''}"><td>${t.index}</td><td>${esc(t.token)}</td><td>${t.special?'特殊 token':`[${t.start}, ${t.end})`}</td><td>${esc(target)}</td><td>${esc(pred)}</td><td>${esc(match)}</td></tr>`}).join('');$('#gold').textContent=data.gold_event?JSON.stringify(data.gold_event,null,2):'推理输入没有人工标注，因此没有金标。';$('#truncated').textContent=data.truncated?'⚠ 输入超过模型最大 token 长度，尾部被截断；未覆盖的字符并没有参与预测。':'灰色未覆盖字符可能是空格或 tokenizer 未产生 token 的字符；字符位置为 Python 原文字符偏移。'}
function renderDetails(){const isJson=mode==='prediction'&&detailView==='json';$('#jsonView').classList.toggle('hidden',mode!=='prediction');$('#tokenView').classList.toggle('active',!isJson);$('#jsonView').classList.toggle('active',isJson);$('#tokenPanel').classList.toggle('hidden',isJson);$('#jsonPanel').classList.toggle('hidden',!isJson);$('#tokenHint').classList.toggle('hidden',isJson);$('#detailFooter').classList.toggle('hidden',isJson);$('#resultAvailable').textContent=mode==='prediction'&&data&&data.structured_result?'预测完成，可查看 JSON':'';$('#jsonResult').textContent=data&&data.structured_result?JSON.stringify(data.structured_result,null,2):'请先输入文本并点击“分析这句话”。'}
$('#tokenView').onclick=()=>{detailView='token';renderDetails()};$('#jsonView').onclick=()=>{detailView='json';renderDetails()};
$('#trainingTab').onclick=()=>changeMode('training');$('#predictTab').onclick=()=>changeMode('prediction');$('#next').onclick=()=>{sampleIndex++;load()};$('#predict').onclick=load;$('#prevStep').onclick=()=>{stage=Math.max(0,stage-1);if(mode==='prediction')detailView=stage===3?'json':'token';render()};$('#nextStep').onclick=()=>{stage=Math.min(3,stage+1);if(mode==='prediction')detailView=stage===3?'json':'token';render()};$('#play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('#play').textContent='▶ 自动播放';return}stage=0;render();$('#play').textContent='⏸ 暂停';timer=setInterval(()=>{if(stage>=3){clearInterval(timer);timer=null;$('#play').textContent='▶ 自动播放';return}stage++;if(mode==='prediction')detailView=stage===3?'json':'token';render()},1300)};render();load();
</script></body></html>
