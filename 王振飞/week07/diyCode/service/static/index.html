<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金融事件抽取</title><style>body{font:16px system-ui;background:#f3f5f9;color:#233047;margin:0}main{max-width:900px;margin:40px auto;padding:0 20px}section{background:white;padding:24px;border-radius:12px;margin:16px 0;box-shadow:0 3px 15px #23304712}textarea,select,button{font:inherit}textarea{width:100%;box-sizing:border-box;min-height:160px;padding:12px;border:1px solid #cbd5e1;border-radius:8px}select,button{padding:10px 14px;border-radius:7px;border:1px solid #cbd5e1}button{background:#2457d6;color:white;border:0;cursor:pointer;margin-left:10px}button:disabled{opacity:.5}pre{white-space:pre-wrap;word-break:break-word;background:#f5f7fb;padding:16px;border-radius:8px}#status{color:#a34419}</style></head><body><main><h1>金融事件抽取</h1><p><a href="/bio">打开 BERT + Linear BIO 可视化教学 →</a></p><p>输入金融公告，选择抽取方法，查看事件类型、触发词和相关信息。</p><section><label for="text">公告内容</label><p><textarea id="text" placeholder="请输入要分析的金融公告，最多 5000 字"></textarea></p><label for="method">抽取方法</label> <select id="method"><option value="bert_linear">BERT + Linear</option><option value="bert_crf">BERT + CRF</option><option value="llm_zero">LLM Zero-shot</option><option value="llm_few">LLM Few-shot</option></select><button id="run">开始抽取</button><p id="status" aria-live="polite"></p></section><section><h2>结构化结果</h2><pre id="result">结果将显示在这里</pre></section></main><script>const run=document.querySelector('#run'),status=document.querySelector('#status'),result=document.querySelector('#result');run.onclick=async()=>{run.disabled=true;status.textContent='正在抽取，请稍候…';try{const response=await fetch('/api/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.querySelector('#text').value,method:document.querySelector('#method').value})});const data=await response.json();if(!response.ok)throw Error(data.error);result.textContent=JSON.stringify(data,null,2);status.textContent=data.needs_review?'结果需要人工复核':'抽取完成';}catch(e){status.textContent=e.message}finally{run.disabled=false}};</script></body></html>
